[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooperative-pretraining-marl"
version = "0.1.0"
description = "Cooperative Pretraining for Robust Emergent Communication Under Adversarial Pressure"
authors = [
    {name = "Christian A. Rogers", email = "Christian.Rogers@utah.edu"},
    {name = "Nathan Jensen", email = "u1493643@utah.edu"},
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pettingzoo>=1.24.0",
    "gymnasium>=0.29.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.14.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
