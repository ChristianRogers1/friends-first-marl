# Decoupled sweep configuration
#
# Uses the new decoupled interface: pretraining_episodes and phase2_episodes
# are specified independently so changing pretraining does not alter the
# Phase 2 evaluation window.
#
# Intended usage: sweep over pretraining_episodes in [0, 2500, 5000, 10000,
# 25000] while keeping phase2_episodes fixed at a large value.  The pipeline
# script overrides pretraining_episodes per job.

env:
  num_attributes: 3
  num_values: 5
  num_distractors: 2
  vocab_size: 10
  msg_length: 3
  cooperative_reward_weight: 1.0
  leakage_penalty_weight: 1.0

agent:
  hidden_dim: 128
  comm_hidden_dim: 64
  lr_actor: 0.001
  lr_critic: 0.001
  gamma: 0.95
  tau: 0.01
  gumbel_temperature: 1.0

training:
  # Decoupled episode counts -- Phase 2 is fixed at 100k for all runs.
  pretraining_episodes: 5000   # overridden per-job in sweep
  phase2_episodes: 100000      # fixed across all sweep conditions

  batch_size: 256
  buffer_capacity: 100000
  update_every: 4
  eval_every: 500
  eval_episodes: 100
  checkpoint_every: 5000

  noise_scale: 0.1
  noise_decay: 0.9999
  min_noise: 0.01
  reset_noise_on_phase2: true

  phase_transition_buffer: "flush"
  cic_eval_every: 1000

screening:
  pretraining_episodes_sweep: [2500, 5000, 10000, 25000]
  seeds_per_condition: 5

confirmation:
  seeds_per_condition: 15

experiment:
  seed: 42
  num_seeds: 12
  device: "cuda"
  log_dir: "runs"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
