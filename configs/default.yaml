# Default configuration for cooperative pretraining experiments
# Cooperative Pretraining for Robust Emergent Communication Under Adversarial Pressure

env:
  num_attributes: 3      # Structured attributes composing target state
  num_values: 5           # Possible values per attribute
  num_distractors: 2      # Distractor targets presented to listener
  vocab_size: 10          # Discrete communication vocabulary size
  msg_length: 3           # Number of symbols per message
  cooperative_reward_weight: 1.0
  leakage_penalty_weight: 0.5

agent:
  hidden_dim: 128         # Hidden layer size for actor/critic
  comm_hidden_dim: 64     # Hidden layer size for communication module
  lr_actor: 0.001         # Actor learning rate
  lr_critic: 0.001        # Critic learning rate
  gamma: 0.95             # Discount factor
  tau: 0.01               # Soft update rate for target networks
  gumbel_temperature: 1.0 # Gumbel-Softmax temperature

training:
  total_episodes: 50000
  pretraining_ratio: 0.25  # Fraction of episodes for cooperative pretraining
  batch_size: 256
  buffer_capacity: 100000
  update_every: 4          # Update networks every N episodes
  eval_every: 500          # Evaluate every N episodes
  eval_episodes: 100       # Episodes per evaluation
  checkpoint_every: 5000   # Checkpoint every N episodes
  noise_scale: 0.1         # Exploration noise scale
  noise_decay: 0.9999      # Noise decay per episode
  min_noise: 0.01          # Minimum noise

experiment:
  seed: 42
  num_seeds: 5             # Seeds for screening stage
  device: "cuda"            # Use "cuda" if GPU available
  log_dir: "runs"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
